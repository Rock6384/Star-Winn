<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Game Registration - Tiranga Edition</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            /* Tiranga Flag Gradient Background: Saffron -> White -> Green */
            background: linear-gradient(135deg, #FF9933 0%, #ffffff 50%, #138808 100%);
            overflow: hidden;
            position: relative;
        }

        /* Decorative background glow */
        body::before {
            content: '';
            position: absolute;
            width: 500px;
            height: 500px;
            background: rgba(255, 255, 255, 0.2);
            border-radius: 50%;
            top: -100px;
            left: -100px;
            z-index: 0;
        }

        .register-container {
            position: relative;
            z-index: 1;
            background: rgba(255, 255, 255, 0.92);
            padding: 40px 30px;
            border-radius: 20px;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.2);
            width: 100%;
            max-width: 400px;
            text-align: center;
            border-top: 6px solid #FF9933;
            border-bottom: 6px solid #138808;
        }

        .register-container h2 {
            color: #333;
            margin-bottom: 8px;
            font-size: 26px;
            letter-spacing: 1px;
        }

        .flag-stripe-banner {
            display: flex;
            height: 4px;
            width: 60px;
            margin: 0 auto 20px auto;
            border-radius: 2px;
            overflow: hidden;
        }

        .stripe-saffron { background-color: #FF9933; flex: 1; }
        .stripe-white { background-color: #ffffff; flex: 1; border-top: 1px solid #ccc; border-bottom: 1px solid #ccc;}
        .stripe-green { background-color: #138808; flex: 1; }

        .register-container p {
            color: #666;
            font-size: 14px;
            margin-bottom: 25px;
        }

        .input-group {
            position: relative;
            margin-bottom: 20px;
            text-align: left;
        }

        .input-group label {
            display: block;
            font-size: 13px;
            color: #444;
            margin-bottom: 6px;
            font-weight: 600;
        }

        .input-group input {
            width: 100%;
            padding: 12px 15px;
            border: 2px solid #ddd;
            border-radius: 8px;
            font-size: 14px;
            outline: none;
            transition: 0.3s;
            background: #fafafa;
        }

        .input-group input:focus {
            border-color: #FF9933;
            background: #fff;
            box-shadow: 0 0 8px rgba(255, 153, 51, 0.2);
        }

        .btn-submit {
            width: 100%;
            padding: 12px;
            /* Navy Blue Chakra / Tiranga button gradient */
            background: linear-gradient(135deg, #000080 0%, #138808 100%);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.3s;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.15);
        }

        .btn-submit:hover {
            opacity: 0.9;
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.2);
        }

        .login-link {
            margin-top: 20px;
            font-size: 13px;
            color: #555;
        }

        .login-link a {
            color: #000080;
            text-decoration: none;
            font-weight: bold;
        }

        .login-link a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>

    <div class="register-container">
        <h2>Game Registration</h2>
        <div class="flag-stripe-banner">
            <div class="stripe-saffron"></div>
            <div class="stripe-white"></div>
            <div class="stripe-green"></div>
        </div>
        <p>Create your profile & start playing!</p>

        <form action="#" method="POST">
            <div class="input-group">
                <label for="username">Player Name</label>
                <input type="text" id="username" placeholder="Enter your gamer tag" required>
            </div>

            <div class="input-group">
                <label for="email">Email / ID</label>
                <input type="email" id="email" placeholder="Enter your email" required>
            </div>

            <div class="input-group">
                <label for="password">Password</label>
                <input type="password" id="password" placeholder="Create a secure password" required>
            </div>

            <button type="submit" class="btn-submit">Register Now</button>
        </form>

        <div class="login-link">
            Already have an account? <a href="#">Login here</a>
        </div>
    </div>

</body>
</html>
