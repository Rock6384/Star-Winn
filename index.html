<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Starwinn - Tiranga Edition</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            /* Tiranga True Vertical Flag Gradient Sequence */
            background: linear-gradient(135deg, #FF9933 0%, #FFFFFF 50%, #138808 100%);
            position: relative;
            overflow: hidden;
        }

        .container {
            position: relative;
            z-index: 2;
            background: rgba(255, 255, 255, 0.95);
            padding: 45px 35px;
            border-radius: 20px;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.25);
            width: 100%;
            max-width: 420px;
            text-align: center;
            /* Tiranga Top & Bottom Borders */
            border-top: 6px solid #FF9933;
            border-bottom: 6px solid #138808;
        }

        .container h1 {
            color: #222;
            font-size: 30px;
            margin-bottom: 5px;
            letter-spacing: 1px;
        }

        .subtitle {
            color: #666;
            font-size: 14px;
            margin-bottom: 20px;
            font-weight: 600;
        }

        /* Exact Tiranga Flag Stripe Bar */
        .tiranga-stripe {
            display: flex;
            height: 6px;
            width: 80px;
            margin: 0 auto 25px auto;
            border-radius: 3px;
            overflow: hidden;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }

        .saffron { background-color: #FF9933; flex: 1; }
        .white { background-color: #FFFFFF; flex: 1; border-left: 1px solid #ddd; border-right: 1px solid #ddd; }
        .green { background-color: #138808; flex: 1; }

        .container p {
            color: #555;
            font-size: 15px;
            margin-bottom: 30px;
            line-height: 1.5;
        }

        .btn-group {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .btn {
            width: 100%;
            padding: 13px;
            border-radius: 8px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            text-decoration: none;
            transition: 0.3s;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.15);
        }

        /* Chakra Blue & Tiranga Mix */
        .btn-primary {
            background: linear-gradient(135deg, #FF9933 0%, #138808 100%);
            color: white;
            border: none;
        }

        .btn-primary:hover {
            opacity: 0.9;
            transform: translateY(-2px);
        }

        .btn-secondary {
            background: #ffffff;
            color: #000080; /* Ashok Chakra Navy Blue */
            border: 2px solid #000080;
        }

        .btn-secondary:hover {
            background: #f0f4ff;
            transform: translateY(-2px);
        }

        .footer {
            margin-top: 25px;
            font-size: 12px;
            color: #777;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>STARWINN</h1>
        <div class="subtitle">Official Demo Game Hub</div>
        
        <div class="tiranga-stripe">
            <div class="saffron"></div>
            <div class="white"></div>
            <div class="green"></div>
        </div>

        <p>Welcome to Starwinn! Register your profile to jump straight into the action.</p>

        <div class="btn-group">
            <a href="register.html" class="btn btn-primary">Register Now</a>
            <a href="#" class="btn btn-secondary">Play as Guest</a>
        </div>

        <div class="footer">
            Designed for Starwinn Demo
        </div>
    </div>

</body>
</html>
